<!-- @dsCard height=288 -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>AlterPark</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface); color: var(--text-primary); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .brand { fill: var(--primary); }
  .white { fill: var(--text-primary); }
  .accent { fill: var(--accent); }
  .second { fill: var(--secondary); }
  .cut { fill: var(--surface); }
  .bay { fill: var(--text-primary); }
  .words { position: absolute; left: var(--space-8); bottom: var(--space-8); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 88px; line-height: 0.95; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-primary); }
  .tag { margin: var(--space-3) 0 0 2px; font-size: 14px; line-height: 20px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      primary 192×304 slab bleeding top and bottom (the orange people know) · text-primary 96×160 · secondary 48×48 (logo car) · accent 48×32 (stars) — ≈30% of 960×288
  arrangement one tall orange slab with satellites stacked on its right, bottoms on the space-8 line
  pattern     literal motif: parking bays — 5 bay lines (space-1 wide, space-16 tall) at a space-8 pitch cut into the slab in surface, closed by one base line, echoing the hero photo's painted bays
  scales      sides in space-8 multiples; gutter space-4; pitch space-8; slab and blocks square (the system rounds only buttons and photos); the white block uses radius-md
-->
<rect class="brand" x="48" y="-8" width="192" height="304"/>
<rect class="cut" x="72" y="160" width="4" height="64"/>
<rect class="cut" x="104" y="160" width="4" height="64"/>
<rect class="cut" x="136" y="160" width="4" height="64"/>
<rect class="cut" x="168" y="160" width="4" height="64"/>
<rect class="cut" x="200" y="160" width="4" height="64"/>
<rect class="cut" x="72" y="224" width="132" height="4"/>
<rect class="white" x="256" y="96" width="96" height="160" rx="15"/>
<rect class="second" x="368" y="208" width="48" height="48"/>
<rect class="accent" x="368" y="160" width="48" height="32"/>
<rect class="brand" x="432" y="0" width="48" height="10"/>
</svg>
</div>
<div class="words">
  <h1 class="name">AlterPark</h1>
  <p class="tag">L’autre parking — stationnement à proximité de l’aéroport de Nantes.</p>
</div>
</div>
</body>
</html>
